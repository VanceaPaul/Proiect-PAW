version: '3.9'
services:
  db:
    image: mysql:8.0
    container_name: quiz-app-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quiz_app
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: ./backend
    image: quiz-app-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/quiz_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_JWT_SECRET: change-me-please-change-me-please-change-me
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    image: quiz-app-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
